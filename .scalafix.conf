# Applied by `scala-cli fix --power` (check mode in CI). Unused imports are also caught by the compiler: CI compiles
# with `-Wunused:all -Werror` (see project.scala).
rules = [
  OrganizeImports
  RedundantSyntax
  NoAutoTupling
  LeakingImplicitClassVal
]

OrganizeImports {
  # Java first, then Scala, then everything else; sorted within each group.
  groups = ["re:javax?\\.", "scala.", "*"]
}
