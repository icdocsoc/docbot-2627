# Applied by `scala-cli fix --power` (check mode in CI). Unused imports are caught separately: CI compiles with
# `-Wunused:all -Werror` (see project.scala), because scalafix's RemoveUnused can't act on Scala 3.3.x diagnostics.
rules = [
  OrganizeImports
  RedundantSyntax
  NoAutoTupling
  LeakingImplicitClassVal
]

OrganizeImports {
  # Java first, then Scala, then everything else; sorted within each group.
  groups = ["re:javax?\\.", "scala.", "*"]
}
