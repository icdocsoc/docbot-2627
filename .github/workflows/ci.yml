name: CI

# Third-party actions are pinned to full commit SHAs (the comment is the tag); Dependabot keeps them current.
# One workflow: format, lint and test run in parallel -> docker (build, push to GHCR) -> deploy (DigitalOcean).
# Test also measures coverage; a separate, non-blocking job turns it into a run summary and a PR comment.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Supersede stale runs on PRs, but never cancel a run on main or a tag (it may be publishing or deploying).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: no token permissions by default; each job grants only what it needs.
permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  format:
    name: Format (scalafmt)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The JDK the bot runs on. scala-cli uses it as-is (no extra JVM download).
      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"

      # Caches the coursier cache (dependencies, scalafmt, scalafix); the key follows project.scala.
      - name: Cache dependencies
        uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v9.0.1
        with:
          extraFiles: project.scala

      # Same scala-cli version as the Dockerfile.
      - name: Set up scala-cli
        uses: coursier/setup-action@d5a17f9aaeb260f9ba336a5b582fb49f79c64ac4 # v3.1.0
        with:
          apps: scala-cli:1.19.0

      # --server=false: skip the Bloop compile server. On a fresh runner it costs a ~115 MB download and startup, and
      # nothing is reused between runs, so it only slows CI down.
      - name: Check formatting
        run: scala-cli fmt --check --server=false . || { echo "Run 'scala-cli fmt .' to fix."; exit 1; }

  lint:
    name: Lint (scalafix)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The JDK the bot runs on. scala-cli uses it as-is (no extra JVM download).
      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"

      # Caches the coursier cache (dependencies, scalafmt, scalafix); the key follows project.scala.
      - name: Cache dependencies
        uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v9.0.1
        with:
          extraFiles: project.scala

      # Same scala-cli version as the Dockerfile.
      - name: Set up scala-cli
        uses: coursier/setup-action@d5a17f9aaeb260f9ba336a5b582fb49f79c64ac4 # v3.1.0
        with:
          apps: scala-cli:1.19.0

      - name: Check lint rules
        run: scala-cli --power fix --check --server=false . || { echo "Run 'scala-cli --power fix .' to fix."; exit 1; }

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The JDK the bot runs on. scala-cli uses it as-is (no extra JVM download).
      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"

      # Caches the coursier cache (dependencies, scalafmt, scalafix); the key follows project.scala.
      - name: Cache dependencies
        uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v9.0.1
        with:
          extraFiles: '["project.scala", ".github/coverage/Report.scala"]'

      # Same scala-cli version as the Dockerfile.
      - name: Set up scala-cli
        uses: coursier/setup-action@d5a17f9aaeb260f9ba336a5b582fb49f79c64ac4 # v3.1.0
        with:
          apps: scala-cli:1.19.0

      # -Werror turns the -Wunused:all warnings from project.scala into errors.
      # -coverage-out turns on the Scala 3 compiler's built-in coverage instrumentation, only for this run (never in
      # project.scala, so the Docker image is not instrumented). The exclude regexes match the path without its
      # extension: test sources and src/Bot (pure Discord wiring that needs a live Discord connection).
      - name: Run tests with coverage
        run: >
          scala-cli test --server=false --scalac-option -Werror
          --scalac-option -coverage-out:coverage/data
          --scalac-option '-coverage-exclude-files:.*\.test,.*/Bot'
          .

      # The compiler only writes raw scoverage data; this converts it to Cobertura XML and an HTML report.
      - name: Generate coverage report
        run: scala-cli run --server=false .github/coverage/Report.scala -- coverage/data . coverage/report

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/report
          if-no-files-found: error
          retention-days: 14

  # Summarise the coverage report on the run page and (same-repo PRs only) in a PR comment. Nothing else depends on
  # this job, so a failure here (e.g. posting the comment) never blocks the Docker image or the deploy.
  # It never checks out or runs repository code: it only parses the artifact uploaded by the Test job.
  coverage:
    name: Coverage report
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # only used by the PR comment step below
    steps:
      - name: Download coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-report
          path: coverage

      # Cobertura XML -> markdown (written to code-coverage-results.md). Report only: it never fails the build.
      # Green from 80%, yellow from 60%. To enforce a minimum later, set fail_below_min: true (uses the lower threshold).
      - name: Summarise coverage
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: coverage/cobertura.xml
          badge: true
          format: markdown
          output: file
          indicators: true
          hide_complexity: true
          fail_below_min: false
          thresholds: "60 80"

      - name: Compose summary
        run: |
          {
            echo "## Test coverage"
            echo
            cat code-coverage-results.md
            echo
            echo "Excludes the tests and \`src/Bot.scala\` (Discord wiring). The full HTML report is in the \`coverage-report\` artifact of [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
          } > coverage-summary.md
          cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"

      # The token is read-only on pull requests from forks, so only comment on PRs from this repository.
      - name: Comment on pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: coverage
          path: coverage-summary.md

  docker:
    name: Docker (build and push)
    needs: [format, lint, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Only log in when we're going to push (PRs just verify the build).
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Redeploy the DigitalOcean App Platform worker once the new image is on GHCR.
  # App Platform can't watch GHCR itself, so we trigger a deployment (which re-pulls :latest).
  deploy:
    name: Deploy (DigitalOcean)
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: {}
    concurrency: deploy-docbot
    steps:
      - name: Set up doctl
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Trigger App Platform deployment
        run: doctl apps create-deployment "$APP_ID" --force-rebuild --wait
        env:
          APP_ID: e7c30070-eb80-4478-8ee9-c388be3bb6da
